<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tracked work{% endblock %} · Action Tracker</title>
<style>{{ asset("_style.css") }}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s-open" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="s-in_progress" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 3.2a3.8 3.8 0 0 1 0 7.6z" fill="currentColor"/></symbol>
  <symbol id="s-blocked" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.2 7h5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="s-done" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M4.3 7.2l1.9 1.9 3.6-3.9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="s-dropped" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9L4.9 9.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 14 14"><path d="M7 1.6l5.6 9.8H1.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 5.6v2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="9.9" r=".8" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 14 14"><path d="M2.8 7.4l2.8 2.8 5.6-6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 6.4v3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="4.3" r=".8" fill="currentColor"/></symbol>
  <symbol id="i-file" viewBox="0 0 14 14"><path d="M3.5 1.8h4.4l2.6 2.6v7.8h-7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M7.7 1.9v2.7h2.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 14 14"><path d="M2.5 11.5l.5-2.6 6.3-6.3 2.1 2.1-6.3 6.3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 14 14"><path d="M5.2 3.5L8.8 7l-3.6 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Action Tracker, tracked work">
      <span class="brand-mark"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.8 7.4l2.8 2.8 5.6-6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Action Tracker
    </a>
    <span class="mode {{ 'live' if mode.live }}" title="{{ mode.detail }}">
      <span class="dot" aria-hidden="true"></span>{{ mode.label }}{% if mode.live and mode.detail %} · {{ mode.detail }}{% endif %}
    </span>
  </div>
</header>
{% block bar %}{% endblock %}
<main>
  <div aria-live="polite">
    {% if error %}<div class="notice error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span>{{ error }}</span></div>{% endif %}
    {% if message %}<div class="notice success"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>{{ message }}</span></div>{% endif %}
  </div>
  {% block body %}{% endblock %}
</main>
<script>{{ asset("_app.js") }}</script>
</body>
</html>
